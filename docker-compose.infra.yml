name: proativa-siscapro-dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proativa}
      POSTGRES_USER: ${POSTGRES_USER:-proativa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup-dev.ps1 antes de subir}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - proativa_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proativa} -d ${POSTGRES_DB:-proativa}"]
      interval: 5s
      timeout: 5s
      retries: 25
    networks: [proativa]
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - proativa_dev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [proativa]
networks:
  proativa:
    driver: bridge
volumes:
  proativa_dev_postgres:
  proativa_dev_redis:
