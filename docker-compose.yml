name: proativa-siscapro-v2
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proativa}
      POSTGRES_USER: ${POSTGRES_USER:-proativa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup.sh ou scripts/setup.ps1 antes de subir}
    volumes:
      - proativa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proativa} -d ${POSTGRES_DB:-proativa}"]
      interval: 5s
      timeout: 5s
      retries: 25
    networks: [proativa]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - proativa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [proativa]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Execute o setup para criar DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Execute o setup antes de subir}
      AITINET_ADMIN_PASSWORD: ${AITINET_ADMIN_PASSWORD:?Execute o setup antes de subir}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DOCUMENTS_DIR: /app/private-documents
    volumes:
      - proativa_documents:/app/private-documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 8
    expose: ["3000"]
    networks: [proativa]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [proativa]

networks:
  proativa:
    driver: bridge

volumes:
  proativa_postgres:
  proativa_redis:
  proativa_documents:
