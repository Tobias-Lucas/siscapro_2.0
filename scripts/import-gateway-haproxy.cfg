global
    maxconn 128
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 10s
    timeout client 1800s
    timeout server 1800s

frontend mariadb_local_port
    bind 0.0.0.0:3306
    default_backend maria_internal

backend maria_internal
    server mariadb mariadb-import:3306 check inter 3s rise 2 fall 3
